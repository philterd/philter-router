# Route by local-LLM classification and by language.
#
# The doc-type classifier runs once per file (cached) and its label selects the policy. The last route
# has an empty match, so it applies to any Spanish document that reached it.

server:
  enabled: true
  port: 8080

engines:
  philter1: { url: "http://philter1:8080" }

classifiers:
  doc-type:
    endpoint: "http://ollama:11434"
    model: llama3.1
    labels: [medical, financial, legal, general]
    prompt: |
      Classify this document into exactly one of: medical, financial, legal, general.
      Reply with only the label.
      {{text}}

routes:
  - name: medical
    match: { classification: { classifier: doc-type, label: medical } }
    languages: [any]
    engine: philter1
    policy: hipaa

  - name: financial
    match: { classification: { classifier: doc-type, label: financial } }
    languages: [any]
    engine: philter1
    policy: financial

  - name: spanish-any
    match: {}                 # any file, gated only by language
    languages: [spa]
    engine: philter1
    policy: general-es

default:
  engine: philter1
  policy: default
